# Образец файла настроек развёртывания. Скопируйте его в deploy.local.yaml рядом (настоящий файл в репозиторий не
# попадает) и подставьте настоящие значения вместо угловых скобок.
#
# Это единственный файл настроек развёртывания. Рядом лежит ещё config/local.yaml — файл настроек самого
# приложения, который ложится на сервер дословно (образец — local.example.yaml).

# ── Куда и чем подключаться ──
server:
  host: <адрес сервера>        # куда ходить по SSH
  port: 22                     # порт SSH
  user: <пользователь>         # пользователь SSH; развёртывание требует прав root
  keyPath: <путь к ключу SSH>  # закрытый ключ на рабочей машине, например C:/Users/you/.ssh/id_rsa

git:
  repoUrl: <git@github.com:организация/репозиторий.git>   # откуда сервер забирает код
  # Закрытый ключ, которым сервер обращается к GitHub. Правильнее всего завести отдельный ключ ТОЛЬКО ДЛЯ ЧТЕНИЯ
  # командой `node .agents/skills/deploy/scripts/remote.cjs keygen` и добавить напечатанную открытую половину в
  # репозиторий (Settings → Deploy keys, галку «Allow write access» не ставить).
  deployKeyPath: <путь к закрытому ключу>   # например C:/Users/you/.ssh/<имя>-deploy

site:
  dns: <публичный домен>   # адрес, который обслуживает nginx, например app.example.com

# НЕОБЯЗАТЕЛЬНЫЕ переопределения (без них всё вычисляется само):
# project:
#   path: /opt/node/<имя>   # каталог рабочей копии на сервере (по умолчанию /opt/node/<имя службы>)
# service:
#   name: <имя>             # основа имени службы и раздела nginx (по умолчанию имя из package.json)
#   instance: prod          # окончание имени службы: <имя>--<окончание>
# node:
#   version: <x.y.z>        # версия Node.js на сервере (по умолчанию из .envrc проекта)

env:
  DEBUG: config-info   # значение переменной DEBUG в .env приложения на сервере (можно не задавать)

# ── Эталон общего навыка развёртывания (для команды sync.cjs) ──
# Хранилище git на сервере. Подключение — тем же ключом SSH; адрес, порт и пользователь по умолчанию из server.
skillSource:
  repo: /opt/node/deploy-skill.git
  # host: <адрес>   # если эталон лежит не на сервере развёртывания или нужен внешний адрес
  # port: 22
  # user: root

# ── Автообновление ──
# Раздел ложится на сервер как deploy/deploy-config.yml, его читает update.cjs — скрипт, который раз в минуту
# сверяет рабочую копию с веткой на GitHub.
autoUpdate:
  branch: master   # ветка, за которой следит автообновление

  # Письмо с итогом обновления уходит на все адреса списка. С блоком smtp — через SMTP пакетом nodemailer, без
  # него — через системную команду `mail`, если она установлена на сервере.
  emails:
    - <адрес первого получателя>

  # Отправка по SMTP. Уберите блок целиком — и этот способ выключится.
  smtp:
    host: <адрес сервера SMTP>
    port: 465                             # 465 — шифрование сразу; 587 или 25 — STARTTLS либо без него
    from: 'SERVER <server@example.com>'   # от чьего имени уходит письмо
    user: <пользователь>
    pass: <пароль>

  # Сообщения о результате обновления в Телеграм. Уберите блок — канал выключится.
  telegram:
    deployReportBot:
      token: '<токен бота>'
      username: '<username бота>'   # не используется, помогает понять, к какому боту относится ключ
      # Числовые номера чатов: положительный — личный чат (человек должен нажать «Старт» в боте), отрицательный
      # (-100…) — группа (бота нужно в неё добавить). Имя бота не подходит: себе он не пишет.
      chatIds:
        - <номер личного чата, например 314859878>

# ── Ключи доступа к маршрутам службы ──
# Раздел ложится на сервер как config/access.local.yaml (права 0600). Нужен, когда в config/local.yaml включено
# webServer.auth.enabled. Ключ выпускает `npm run access:issue-key`, проверку делает `npm run access:check`;
# формат описан в документе проекта, на который ссылается PROJECT.md навыка. Правила проекта могут требовать у
# клиента дополнительные поля.
access:
  clients:
    - id: <кто пользуется ключом, например ok-robot>
      keys:
        - id: primary
          token: '<выпущенный ключ>'
