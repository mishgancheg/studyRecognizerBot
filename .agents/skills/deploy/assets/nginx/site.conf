# Образец раздела nginx для службы проекта. Общий для всех проектов: эталон хранится вместе с навыком развёртывания.
#
# Это ШАБЛОН: подстановки вида {{…}} заполняет `remote.cjs deploy`, после чего готовый файл кладётся на сервер как
# /etc/nginx/sites-available/{{domain}}.conf и включается ссылкой из sites-enabled.
#
#   {{domain}}               — публичный домен (site.dns в config/deploy.local.yaml)
#   {{upstream}}             — имя группы серверов nginx, чтобы блоки разных проектов не сталкивались
#   {{port}}                 — порт приложения на самой машине (webServer.port в config/local.yaml навыка)
#   {{snippet}}              — общий фрагмент проксирования проекта, /etc/nginx/snippets/<имя службы>-proxy.conf
#   {{client_max_body_size}} — предел размера тела запроса (nginx.clientMaxBodySize в project.yaml)
#   {{proxy_timeout}}        — срок ожидания ответа приложения (nginx.proxyTimeout в project.yaml)
#   {{extra_locations}}      — дополнительные блоки location проекта (nginx.extraLocations в project.yaml)
#   {{cert_dir}}             — каталог сертификата: отдельный сертификат поддомена или подстановочный
#                              сертификат родительского домена

upstream {{upstream}} {
    server 127.0.0.1:{{port}};
    keepalive 8;
}

server {
    server_name {{domain}};
    access_log /var/log/nginx/{{domain}}.log;
    error_log /var/log/nginx/{{domain}}.ERROR.log;

    client_max_body_size {{client_max_body_size}};

    # Сжатие ответов JSON и страниц.
    gzip on;
    gzip_types text/plain text/css text/html application/json application/javascript;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;

{{extra_locations}}
    location / {
        include snippets/{{snippet}};

        proxy_read_timeout {{proxy_timeout}};
        proxy_send_timeout {{proxy_timeout}};

        proxy_pass http://{{upstream}};
    }

    # На nginx 1.25.1 и новее совмещённая запись объявлена устаревшей — там пишут `listen 443 ssl;`
    # и отдельной строкой `http2 on;`. На сервере стоит nginx 1.18, который знает только эту форму.
    listen 443 ssl http2;
    ssl_certificate {{cert_dir}}/fullchain.pem;
    ssl_certificate_key {{cert_dir}}/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
}

# Обращения по незащищённому протоколу переводятся на https. Чужие имена, попавшие на этот адрес,
# получают 404: отвечать на них содержимым сайта незачем.
server {
    if ($host = {{domain}}) {
        return 301 https://$host$request_uri;
    }

    listen 0.0.0.0:80;
    server_name {{domain}};
    return 404;
}

# Проверить и применить: sudo nginx -t && sudo systemctl reload nginx
