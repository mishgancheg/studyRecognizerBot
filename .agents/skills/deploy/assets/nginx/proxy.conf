# Общие настройки проксирования службы. Разворачивается как /etc/nginx/snippets/<имя службы>-proxy.conf и
# подключается строкой `include snippets/<имя службы>-proxy.conf;` внутри блока `location`.
#
# `proxy_http_version 1.1` вместе с пустым заголовком `Connection` держит соединение к приложению
# живым и позволяет проходить ответам, отдаваемым по частям.
#
# Заголовки семейства X-Forwarded-* — единственный способ для приложения узнать, что снаружи его
# открывают по адресу https://<домен>, а не по http://127.0.0.1.

proxy_http_version 1.1;
proxy_set_header Connection '';

proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;

proxy_connect_timeout 5s;
proxy_redirect off;
